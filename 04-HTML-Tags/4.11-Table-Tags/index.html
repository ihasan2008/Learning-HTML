<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Table Tags</title>
    </head>
    <body>

        <table>
            <caption>Student Information</caption>
            <colgroup>
                <col style="background-color: #f2f2f2; width: 100px;">
                <col span="4" style="background-color: #e6f7ff;">
            </colgroup>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Department</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td>HaSaN</td>
                    <td>18</td>
                    <td>Computer Science</td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>Rafiq</td>
                    <td>19</td>
                    <td>Electrical Engineering</td>
                </tr>
                <tr>
                    <td>03</td>
                    <td>Rana</td>
                    <td>20</td>
                    <td>Mechanical Engineering</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total</td>
                    <td>3</td>
                </tr>
            </tfoot>
        </table>

    </body>
</html>
