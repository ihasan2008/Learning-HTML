<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>All Heading Tags</title>
    </head>
    <body>
        <h1>This is an H1 heading = Main Heading</h1>
        <h2>This is an H2 heading = Sub Heading</h2>
        <h3>This is an H3 heading = Section Heading</h3>
        <h4>This is an H4 heading = Sub Section Heading</h4>
        <h5>This is an H5 heading = Small Heading</h5>
        <h6>This is an H6 heading = Smallest Heading</h6>
    </body>
</html>
