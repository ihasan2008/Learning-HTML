<!doctype html>
<html>
    <head>
        <title>HTML Text Formatting Tags</title>
    </head>
    <body>

        <b>Bold Text</b>
        <br>
        <strong>Important Bold Text</strong>
        <br>
        <i>Italic Text</i>
        <br>
        <em>Emphasized or Important Italic Text</em>
        <br>
        <u>Underlined Text</u>
        <br>
        <mark>Marked or Highlighted Text</mark>
        <br>
        <small>Small Text</small>
        <br>
        <!-- Superscript -->
        <p>a<sup>2</sup>-b<sup>2</sup>=(a+b)(a-b)</p>
        <!-- Subscript -->
        <p>H<sub>2</sub>O</p>
        <del>Deleted Text</del>
        <br>
        <ins>Inserted Text</ins>
        <br>
        <s>Strikethrough Text</s>
        <br>
        <code>
            Code Text -:
            <br>
            console.log("Hello World");
        </code>
        <kbd>Ctrl + S</kbd>
        <samp>Sample Output</samp>
        <br>
        <var>Variable Text</var>

    </body>
</html>
